<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叙事工坊 · Project Y</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header class="app-header">
    <a class="brand" href="/">Y<span>叙事工坊<small>PROJECT Y / NARRATIVE STUDIO</small></span></a>
    <div class="document-state"><i></i><span id="state">正在读取工作区</span></div>
    <nav aria-label="工作区操作"><button id="reload">重新载入</button><button id="validate">检查草稿</button><button id="save">保存</button><button class="primary" id="export">保存并导出 ↗</button></nav>
  </header>
  <main>
    <aside class="library" aria-label="叙事资料库">
      <div class="eyebrow">THE STORY ARCHIVE</div><h1>每个选择，都有去处。</h1>
      <input id="search" type="search" placeholder="搜索名称、正文或 ID…" aria-label="搜索叙事内容">
      <div id="categories"></div>
      <div class="list-heading"><span id="list-title">任务</span><button id="new">＋ 新建</button></div>
      <div id="rows"></div>
      <footer><span id="counts"></span><a href="http://127.0.0.1:4173" target="_blank" rel="noreferrer">配置工作台 ↗</a></footer>
    </aside>
    <section class="workspace" aria-label="内容编辑与关系图">
      <div class="workspace-toolbar"><div class="segmented" aria-label="工作视图"><button class="active" data-workview="edit">内容编辑</button><button data-workview="graph">关系图</button></div><button id="selection-back" class="quiet" disabled>← 上一条</button></div>
      <section class="inspector" id="edit-workspace">
        <div class="inspector-heading"><div class="eyebrow">EDIT THE STORY</div><h2 id="selection-title">选择一个节点</h2><p id="selection-type"></p></div>
        <div class="inspector-tabs"><button id="form-tab" class="active">属性与正文</button><button id="impact-tab">引用与影响</button><span>草稿即时预览 →</span></div>
        <div id="editor"></div>
        <div class="inspector-actions"><button id="delete" class="danger">删除此条</button><button id="download">下载草稿</button><span id="draft-count">0 项修改</span></div>
      </section>
      <section class="canvas" id="graph-workspace" hidden>
        <div class="canvas-heading"><div><div class="eyebrow">STORY NETWORK</div><h2 id="graph-title">叙事关系图</h2></div><div class="segmented"><button class="active" data-mode="overview">故事总览</button><button data-mode="detail">当前关联</button><button id="fit">适应画布</button></div></div>
        <div class="legend"><span class="mission">任务</span><span class="quest">阶段</span><span class="condition">条件</span><span class="npc">NPC</span><span class="dialogue">对话</span></div>
        <div class="graph-shell"><svg id="graph" role="img" aria-label="叙事关系图"></svg><div class="canvas-hint">点击编辑 · 滚轮缩放 · 拖动平移</div></div>
      </section>
      <div id="diagnostics" hidden></div><div id="status" role="status">同一份配置，连接任务、对话与世界中的人。</div>
    </section>
    <aside class="preview-panel" aria-label="实时叙事预览">
      <div class="preview-heading"><div><div class="eyebrow">STORY, IN CONTEXT</div><h2>叙事预览 <span class="live-dot">实时</span></h2></div><span id="preview-kind" class="badge">任务手记</span></div>
      <div class="preview-caption">随当前草稿更新 · 条件与结果按配置展示</div>
      <div id="preview"></div>
      <div class="preview-footnote">编辑态预览 · 不判定存档条件，不执行动作</div>
    </aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
