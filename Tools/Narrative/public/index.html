<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叙事工坊 · Project Y</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a class="brand" href="/">Y<span>叙事工坊<small>PROJECT Y / NARRATIVE STUDIO</small></span></a><div class="document-state"><i></i><span id="state">正在读取工作区</span></div><nav><button id="reload">重新载入</button><button id="validate">检查草稿</button><button id="save">保存</button><button class="primary" id="export">保存并导出 ↗</button></nav></header>
<main><aside class="library"><div class="eyebrow">叙事资料库</div><h1>每个选择，<br>都有去处。</h1><input id="search" type="search" placeholder="搜索名称、正文或 ID…" aria-label="搜索叙事内容"><div id="categories"></div><div class="list-heading"><span id="list-title">任务</span><button id="new">＋ 新建</button></div><div id="rows"></div><footer><span id="counts"></span><a href="http://127.0.0.1:4173" target="_blank" rel="noreferrer">配置工作台 ↗</a></footer></aside>
<section class="canvas"><div class="canvas-heading"><div><div class="eyebrow">STORY NETWORK</div><h2 id="graph-title">叙事关系图</h2></div><div class="segmented"><button class="active" data-mode="overview">故事总览</button><button data-mode="detail">当前关联</button><button id="fit">适应画布</button></div></div><div class="legend"><span class="mission">Mission</span><span class="quest">Quest</span><span class="condition">Condition</span><span class="npc">NPC</span><span class="dialogue">Dialogue</span></div><div class="graph-shell"><svg id="graph" role="img" aria-label="叙事关系图"></svg><div class="canvas-hint">点击节点查看与编辑 · 滚轮缩放 · 拖动画布平移</div></div><div id="status" role="status">同一份配置，连接任务、对话与世界中的人。</div><div id="diagnostics" hidden></div></section>
<aside class="inspector"><div class="inspector-heading"><div class="eyebrow">内容编辑</div><h2 id="selection-title">选择一个节点</h2><p id="selection-type"></p></div><div class="inspector-tabs"><button id="form-tab" class="active">属性</button><button id="impact-tab">引用与影响</button><button id="preview-tab">对话预览</button></div><div id="editor"></div><div class="inspector-actions"><button id="delete" class="danger">删除此条</button><button id="download">下载草稿</button><span id="draft-count">0 项修改</span></div></aside></main><script type="module" src="/app.js"></script></body></html>
