<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容编辑中心 · Project Y</title><link rel="stylesheet" href="/styles.css"><script type="importmap">{"imports":{"three":"/character/vendor/three.module.min.js"}}</script></head>
<body><aside class="sidebar"><a class="brand" href="/">Y<span>内容编辑中心<small>PROJECT Y / CONTENT STUDIO</small></span></a><div class="eyebrow">创作工作区</div><nav id="modules"></nav><div class="sidebar-bottom"><p>从一个模型，<br>到一段冒险。</p><a href="/README.md" target="_blank">使用与扩展文档 ↗</a><button id="resources">同步 Unity 资源</button><span id="unity-state">正在连接工程</span></div></aside>
<div class="workspace"><header><div class="breadcrumb">PROJECT Y <span>/</span> <b id="module-name">内容资料库</b></div><div class="actions"><span id="draft-count">读取中</span><button id="reload">重读 / 合并</button><button id="review">检查草稿</button><button id="save" class="primary">保存并导出 ↗</button></div></header>
<div id="notice" role="status" aria-live="polite">正在读取工程配置…</div>
<main><section class="library"><div class="eyebrow">CONTENT LIBRARY</div><h1 id="title">武器与物品</h1><p id="description"></p><div class="search"><input id="search" type="search" placeholder="搜索名称、说明、ID…" aria-label="搜索内容"></div><select id="table" aria-label="内容类型"></select><div class="list-head"><span id="total"></span><button id="new">＋ 新建</button></div><div id="rows"></div><div class="library-footer"><button id="download">下载草稿</button><label class="file-button">导入草稿<input id="import" type="file" accept=".json"></label></div></section>
<section class="detail"><div id="empty"><div class="empty-mark">◇</div><h2>让每一个细节，都有来处。</h2><p>选择左侧内容开始编辑，或从工程模型新建物品。</p></div><div id="selected" hidden><div class="detail-head"><div><div id="record-type" class="eyebrow"></div><h2 id="record-name"></h2><span id="record-id"></span></div><div class="actions"><button id="duplicate">复制</button><button id="delete" class="danger">删除</button></div></div><div class="tabs"><button data-tab="edit" class="active">内容与属性</button><button data-tab="links">关联与投放</button><button data-tab="preview">模型与持握</button></div><div id="editor"></div></div></section></main></div>
<dialog id="wizard"><form method="dialog" class="dialog-head"><div><div class="eyebrow">CREATE CONTENT</div><h2 id="wizard-title">新建内容</h2></div><button aria-label="关闭新建窗口">×</button></form><div id="wizard-body"></div><div class="dialog-foot"><span id="wizard-status" role="status"></span><button id="create" class="primary">加入草稿</button></div></dialog>
<dialog id="insight"><form method="dialog" class="dialog-head"><h2 id="insight-title">检查草稿</h2><button aria-label="关闭检查结果">×</button></form><div id="insight-body"></div></dialog>
<dialog id="character"><form method="dialog" class="dialog-head"><h2>角色外观与持握工坊</h2><button aria-label="关闭角色工坊">返回内容中心 ×</button></form><iframe id="character-frame" title="真实角色与持握预览"></iframe></dialog>
<script type="module" src="/app.mjs"></script></body></html>
