<main><h1>直墙与六边形楼板 · 封边检查</h1>
<p>完整六边形保留可行走区域；墙边使用独立裁切六角块补齐直线。封边不可行走、不可选中，也不会点穿到下层。楼梯井、挑空和船体破口保留。</p>
<p>定向验证：258 块封边逐块拾取检查通过，原导航逐格一致；已检查楼层剖切和隐藏。仅请求一次项目编译，未进入 Play。</p>
